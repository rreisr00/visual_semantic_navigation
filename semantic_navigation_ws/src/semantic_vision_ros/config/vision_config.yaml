visual_encoder:
  ros__parameters:
    # "siglip_pure"  → embedding only (no YOLO, lighter, faster)
    # "siglip_yolo"  → embedding + object detection
    retrieval_mode: "siglip_yolo"

    # HuggingFace model ID or local path
    siglip_model_id: "google/siglip-base-patch16-224"

    # Path to YOLOv8 weights (used only in siglip_yolo mode).
    # Stable, CWD-independent location; ultralytics downloads it here on
    # first use if missing. A bare relative name would resolve against the
    # launch CWD and silently re-download per directory.
    yolo_model_path: "~/.ros/semantic_models/yolov8n.pt"

    # Minimum YOLO detection confidence [0.0, 1.0]
    yolo_confidence_threshold: 0.4
    include_crop_embeddings: true
    max_crop_embeddings: 16
    local_files_only: true
    minimum_depth_m: 0.1
    maximum_depth_m: 10.0
