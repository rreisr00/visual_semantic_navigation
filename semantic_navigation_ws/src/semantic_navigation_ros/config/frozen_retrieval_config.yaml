siglip_checkpoint: google/siglip-base-patch16-224
yolo_checkpoint: experiments/yolov8n.pt
preprocessing:
  processor: siglip_auto_processor
  image_encoding: rgb8
  local_files_only: true
multiview_aggregation:
  method: max_topk
  top_k: 3
  max_weight: 0.7
  topk_weight: 0.3
retrieval_method: hybrid_semantic_retrieval
retrieval_weights:
  global_similarity: 0.50
  object_match: 0.15
  crop_similarity: 0.10
  relation_match: 0.10
  room_match: 0.15
rejection_threshold: 0.12
category_mappings: {}
relation_extractor_version: bbox_depth_relations_v2
