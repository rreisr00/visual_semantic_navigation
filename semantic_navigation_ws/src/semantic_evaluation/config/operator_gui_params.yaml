semantic_operator_gui:
  ros__parameters:
    use_sim_time: true
    camera_topic: /camera/image_raw
    # Nav2 velocity_smoother -> collision_monitor -> /cmd_vel -> Gazebo.
    cmd_vel_topic: /cmd_vel_nav
    stamped_cmd_vel: true
    capture_action_name: /capture_waypoint
    semantic_action_name: /navigate_to_semantic_goal
    navigate_action_name: /navigate_to_pose
    add_room_service: /add_room
    clicked_point_topic: /clicked_point
    room_marker_topic: /room_markers
    scene_id: aws_small_house
    rooms_file: ""
    map_file: ""
    graph_database: ""
    queries_file: ""
    ground_truth_file: ""
    start_poses_file: ""
    campaign_output_dir: "~/visual_semantic_navigation/experiments/simulation/campaigns"
    robot_entity_name: semantic_robot
    world_name: default
    teleport_height: 0.01
    frozen_config_hash: ""
    frozen_config_path: ""
    retrieval_method: hybrid_semantic_retrieval
    map_frame: map
    base_frame: base_link
    linear_speed: 0.25
    angular_speed: 0.7
    # Whisper is lazy-loaded. CPU avoids competing with SigLIP/YOLO for VRAM.
    voice_model_size: small
    voice_device: cpu
    voice_compute_type: int8
    voice_language: es
    voice_mic_device: ""
    voice_sample_rate: 16000
    voice_top_k: 5
