experiment:
  name: offline_semantic_retrieval
  seed: 42
  output_id: null

models:
  siglip:
    model_id: google/siglip-base-patch16-224
    processor_fast: true
    local_files_only: true
    batch_size: 16
  yolo:
    checkpoint: "${YOLO_CHECKPOINT}"
    allow_download: false
    confidence_threshold: 0.4
    batch_size: 8

runtime:
  device: auto
  num_workers: 4
  mixed_precision: false

paths:
  cache_root: experiments/offline/cache
  results_root: experiments/offline/results
  manifests_root: experiments/offline/manifests
  annotation_templates_root: experiments/offline/annotation_templates

datasets:
  enabled:
    - siglip_rooms
    - sunrgbd
    - matterport3d
    - visual_genome
  configs_dir: experiments/offline/config/datasets

retrieval:
  multiview:
    method: max_topk
    top_k: 3
    max_weight: 0.7
    topk_weight: 0.3
  weights:
    siglip_with_objects:
      global_similarity: 0.70
      object_match: 0.20
      crop_similarity: 0.10
      relation_match: 0.00
      room_match: 0.00
    siglip_with_objects_and_relations:
      global_similarity: 0.60
      object_match: 0.15
      crop_similarity: 0.10
      relation_match: 0.15
      room_match: 0.00
    hybrid_semantic_retrieval:
      global_similarity: 0.50
      object_match: 0.15
      crop_similarity: 0.10
      relation_match: 0.10
      room_match: 0.15
  rejection:
    initial_threshold: 0.05
    calibration_split: validation

evaluation:
  recall_k: [1, 3, 5]
  nearby_distance: 1
  bootstrap_samples: 2000
  confidence_level: 0.95

reproducibility:
  save_git_commit: true
  save_dependencies: true
  hash_inputs: true
